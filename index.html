<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">共有フォルダ - Gofile</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="./config.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-6">
    <!-- ヘッダー部分（指定のnote画像をアイコン・ヘッダーとして表示） -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
      <div class="flex items-center gap-4">
        <img src="https://assets.st-note.com/img/1794287883-MrIYeAbnKkPRjBOWqy1VJ0fd.png?width=1200" alt="ヘッダー画像" class="w-16 h-16 rounded-lg object-cover border border-slate-700">
        <div>
          <h1 id="folderTitle" class="text-xl font-bold text-emerald-400">読み込み中...</h1>
          <p class="text-xs text-slate-400 mt-1">Gofile ファイル共有ストレージ</p>
        </div>
      </div>
    </div>

    <!-- ファイル一覧セクション -->
    <div id="fileListSection" class="space-y-4">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-slate-400">データを読み込んでいます...</div>
    </div>
  </div>

  <script>
    async function loadFolder() {
      const urlParams = new URLSearchParams(window.location.search);
      const folderId = urlParams.get('id');

      if (!folderId) {
        document.getElementById('folderTitle').textContent = "フォルダが指定されていません";
        document.getElementById('fileListSection').innerHTML = '';
        return;
      }

      try {
        // R2の独自ドメインから直接 JSON をフェッチ（Workerを一切経由しない）
        const jsonUrl = `${window.CONFIG.MEDIA_BASE}/folders/${folderId}.json`;
        const res = await fetch(jsonUrl);
        if (!res.ok) throw new Error("フォルダが見つからないか、削除された可能性があります");

        const folder = await res.json();
        document.getElementById('folderTitle').textContent = `📁 ${folder.name}`;
        document.getElementById('page-title').textContent = `${folder.name} - Gofile`;

        const list = document.getElementById('fileListSection');
        list.innerHTML = '';

        if (!folder.files || folder.files.length === 0) {
          list.innerHTML = '<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-slate-400">ファイルはありません</div>';
          return;
        }

        folder.files.forEach(file => {
          // メディアファイルもR2の独自ドメインから直接配信
          const fileUrl = `${window.CONFIG.MEDIA_BASE}/${file.key}`;
          let previewHtml = '';

          if (file.mime_type && file.mime_type.startsWith('video/')) {
            previewHtml = `<video controls preload="metadata" class="w-full rounded bg-black max-h-[400px] mt-2"><source src="${fileUrl}" type="${file.mime_type}">お使いのブラウザは動画タグに対応していません。</video>`;
          } else if (file.mime_type && file.mime_type.startsWith('image/')) {
            previewHtml = `<img src="${fileUrl}" class="w-full rounded mt-2 max-h-[400px] object-contain bg-black/50">`;
          } else if (file.mime_type && file.mime_type.startsWith('audio/')) {
            previewHtml = `<audio controls class="w-full mt-2"><source src="${fileUrl}" type="${file.mime_type}">お使いのブラウザは音声タグに対応していません。</audio>`;
          }

          const card = document.createElement('div');
          card.className = 'bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3 shadow-lg';

          const topRow = document.createElement('div');
          topRow.className = 'flex justify-between items-center';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'font-bold text-slate-200 truncate mr-2';
          nameSpan.textContent = file.name; // XSS対策のため textContent を使用

          const dlBtn = document.createElement('a');
          dlBtn.href = fileUrl;
          dlBtn.download = file.name;
          dlBtn.className = 'bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 text-xs font-medium rounded transition shrink-0';
          dlBtn.textContent = 'ダウンロード';

          topRow.appendChild(nameSpan);
          topRow.appendChild(dlBtn);
          card.appendChild(topRow);

          if (previewHtml) {
            const previewDiv = document.createElement('div');
            previewDiv.innerHTML = previewHtml;
            card.appendChild(previewDiv);
          }

          list.appendChild(card);
        });

      } catch (err) {
        document.getElementById('folderTitle').textContent = "エラー";
        document.getElementById('fileListSection').innerHTML = `<div class="bg-slate-800 p-6 rounded-xl border border-slate-700 text-center text-red-400">${err.message}</div>`;
      }
    }

    loadFolder();
  </script>
</body>
</html>

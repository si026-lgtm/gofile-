  <style>
    :root {
      --gf-bg: #121519;
      --gf-card-bg: #1b1f24;
      --gf-yellow: #fabb18;
      --gf-yellow-hover: #e0a50f;
      --gf-text-main: #f0f4f8;
      --gf-text-sub: #94a3b8;
      --gf-border: #2d353f;
    }

    body { 
      margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background-color: var(--gf-bg); color: var(--gf-text-main); display: flex; flex-direction: column; min-height: 100vh;
    }

    /* 上部告知バー（イエロー基調） */
    .campaign-banner {
      background: var(--gf-yellow); color: #000000; font-weight: 800; font-size: 13px;
      padding: 10px 0; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 2px 10px rgba(250, 187, 24, 0.3);
    }

    /* ヘッダー：Gofile風 */
    .header-bar { 
      background: var(--gf-card-bg); border-bottom: 1px solid var(--gf-border); padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .gofile-logo {
      font-weight: 900; font-size: 22px; color: var(--gf-yellow); letter-spacing: -0.5px;
      display: flex; align-items: center; gap: 6px;
    }

    .gofile-logo-icon {
      background: var(--gf-yellow); color: #000; border-radius: 6px; width: 26px; height: 26px;
      display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900;
    }

    .download-tag {
      background: var(--gf-yellow); color: #000000; padding: 8px 18px; border-radius: 6px; 
      font-size: 13px; font-weight: 800; display: inline-block; cursor: pointer;
      animation: pulse-glow 1.5s infinite alternate;
    }
    @keyframes pulse-glow {
      from { box-shadow: 0 0 5px rgba(250, 187, 24, 0.4); transform: scale(1); }
      to { box-shadow: 0 0 16px rgba(250, 187, 24, 0.8); transform: scale(1.03); }
    }

    .main-area { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    
    /* Gofileファイルカード */
    .file-card {
      background: var(--gf-card-bg); border: 1px solid var(--gf-border); border-radius: 12px; padding: 24px; 
      max-width: 520px; width: 100%; text-align: left; box-sizing: border-box;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .file-meta {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
    }

    .badge {
      background: rgba(250, 187, 24, 0.15); color: var(--gf-yellow); font-size: 12px; 
      font-weight: bold; padding: 4px 10px; border-radius: 4px; border: 1px solid rgba(250, 187, 24, 0.3);
    }

    .file-size { color: var(--gf-text-sub); font-size: 12px; font-weight: 600; }

    .news-title { font-size: 18px; font-weight: 700; line-height: 1.4; margin: 0 0 16px 0; color: var(--gf-text-main); word-break: break-all; }

    /* 動画プレイヤー風のロード表示 */
    .video-player-mock {
      position: relative; width: 100%; height: 220px; background: #000000;
      border-radius: 8px; overflow: hidden; display: flex; flex-direction: column;
      align-items: center; justify-content: center; border: 1px solid var(--gf-border);
    }

    .play-btn-pulse {
      width: 56px; height: 56px; background: var(--gf-yellow); border-radius: 50%;
      display: flex; align-items: center; justify-content: center; margin-bottom: 12px;
      box-shadow: 0 0 20px rgba(250, 187, 24, 0.5); position: relative;
    }

    .play-icon {
      width: 0; height: 0; border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #000000;
      margin-left: 4px;
    }

    .spinner {
      position: absolute; width: 68px; height: 68px;
      border: 3px solid transparent; border-top-color: var(--gf-yellow);
      border-radius: 50%; animation: spin 1s linear infinite;
    }

    .loading-text { font-size: 14px; font-weight: 700; color: var(--gf-text-main); margin-top: 6px; }
    .sub-loading-text { font-size: 12px; color: var(--gf-text-sub); margin-top: 4px; }

    /* プログレスバー風アニメーション */
    .progress-bar-container {
      position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: #222;
    }
    .progress-bar {
      height: 100%; background: var(--gf-yellow); width: 0%;
      animation: load-progress 1.3s ease-in-out forwards;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes load-progress { 0% { width: 0%; } 100% { width: 100%; } }
  </style>
